<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a;
    color: #c8c8c8;
    font-family: 'Courier New', Courier, monospace;
    font-size: 15px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  #game-wrapper {
    width: 100%;
    max-width: 780px;
    height: 90vh;
    display: flex;
    flex-direction: column;
    border: 1px solid #333;
    border-radius: 4px;
    overflow: hidden;
  }
  #title-bar {
    background: #111;
    border-bottom: 1px solid #333;
    padding: 6px 14px;
    display: flex;
    justify-content: space-between;
    color: #666;
    font-size: 12px;
    letter-spacing: 0.05em;
  }
  #title-bar span.bright { color: #aaa; }
  #output {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px;
    background: #0a0a0a;
    scroll-behavior: smooth;
  }
  #output p {
    margin: 0 0 6px 0;
    line-height: 1.55;
    white-space: pre-wrap;
  }
  #output p.location { color: #fff; font-weight: bold; margin-top: 10px; }
  #output p.narration { color: #c8c8c8; }
  #output p.player-cmd { color: #6af; }
  #output p.error { color: #e66; }
  #output p.item { color: #fc8; }
  #output p.score { color: #8f8; }
  #output p.death { color: #f44; }
  #output p.win { color: #ff4; }
  #output p.separator { color: #333; margin: 8px 0; }
  #input-row {
    display: flex;
    border-top: 1px solid #333;
    background: #111;
  }
  #prompt-label {
    padding: 10px 0 10px 14px;
    color: #6af;
    user-select: none;
  }
  #cmd-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #6af;
    font-family: inherit;
    font-size: inherit;
    padding: 10px 6px;
  }
  #score-bar {
    padding: 6px 14px;
    background: #111;
    border-top: 1px solid #333;
    display: flex;
    gap: 24px;
    font-size: 12px;
    color: #555;
  }
  #score-bar span { color: #888; }
</style>
</head>

function out(text, cls = 'narration') {
  const p = document.createElement('p');
  p.className = cls;

  $('output').appendChild(p);
  $('output').scrollTop = $('output').scrollHeight;
}
function sep() { out('──────────────────────────────', 'separator'); }

// Words a player can type that never name an object ("take the lamp", "pick up the egg")
const STOPWORDS = new Set(['the', 'a', 'an', 'at', 'to', 'with', 'from', 'some', 'of', 'up', 'on']);
function objWords(str) {
  return str.toLowerCase().split(/\s+/).filter(w => w && !STOPWORDS.has(w));
}
// Whole-word match, so "a" or "c" can't accidentally match "case"
function mentions(words, ...names) { return words.some(w => names.includes(w)); }

// ── Helper: inventory item lookup ─────────────────────────────
// How many of the typed words name this item (0 = no match)
function matchScore(id, words) {
  const item = ITEMS[id];
  if (!item) return 0;   // e.g. the mailbox, which is scenery rather than an item
  const names = [...item.name.toLowerCase().split(/\s+/), ...(item.aliases || [])];
  return words.filter(w => names.includes(w)).length;
}
function itemMatches(id, words) { return matchScore(id, words) > 0; }

// The id that matches the most typed words, so "crystal skull" beats the crystal trident.
// Ties go to the earliest id.
function bestMatch(ids, words) {
  let best = null, bestScore = 0;
  for (const id of ids) {
    const score = matchScore(id, words);
    if (score > bestScore) { best = id; bestScore = score; }
  }
  return best;
}

// Inventory first, then the room
function findItem(words) {
  const room = ROOMS[G.location];
  const candidates = [...G.inventory, ...((room && room.items) || [])];
  return bestMatch(candidates, words);
}

function hasItem(id) { return G.inventory.includes(id); }
function lampLit() { return hasItem('lamp') && G.flags.lamp_on; }
function hasTorch() { return hasItem('torch') && G.flags.torch_lit; }
function isLit() {
  const room = ROOMS[G.location];
  if (!room) return true;
  if (!room.dark) return true;
  return lampLit() || hasTorch();
}

// ── Score / Trophy Case ───────────────────────────────────────
const TREASURES = ['egg', 'canary', 'trident', 'coins', 'chalice', 'skull', 'painting', 'sceptre'];
const POINTS = { leaflet: 1, troll: 5, win: 100 };
const MAX_SCORE = TREASURES.reduce((sum, t) => sum + ITEMS[t].points, 0)
  + POINTS.leaflet + POINTS.troll + POINTS.win;

function addScore(pts) {
  G.score += pts;
  out(`[Your score has just gone up by ${pts} point${pts === 1 ? '' : 's'}.]`, 'score');
  updateStatus();
}

function updateStatus() {
  $('ui-score').textContent = G.score;
  $('ui-moves').textContent = G.moves;
  $('ui-loc').textContent = isLit() ? ROOMS[G.location].name : 'Darkness';
}

function putInTrophyCase(id) {
  if (!G.flags.trophy_case_contains.includes(id)) {
    G.flags.trophy_case_contains.push(id);
    addScore(ITEMS[id].points || 0);
  }
}

// ── Look ──────────────────────────────────────────────────────
function look(verbose = true) {
  const room = ROOMS[G.location];
  if (!room) { out('You are in an undefined void.', 'error'); return; }
  if (!isLit()) {
    out('It is pitch black. You are likely to be eaten by a grue.', 'narration');
    if (Math.random() < 0.25) {
      out('Oh no! A grue has found you in the dark!', 'death');
      die('eaten by a grue');
    }
    return;
  }
  out(room.name, 'location');
  if (verbose) out(room.desc, 'narration');
  G.visited.add(G.location);

  // Scenery whose state changes
  if (G.location === 'west_of_house' && G.flags.mailbox_open) {
    out('The mailbox is open.', 'narration');
    if (ITEMS.leaflet.location === 'mailbox') out('  ' + ITEMS.leaflet.desc, 'item');
  }
  if (G.location === 'living_room' && G.flags.rug_moved) {
    out(`The rug has been moved aside, revealing a trap door, which is ${G.flags.trapdoor_open ? 'open' : 'closed'}.`, 'narration');
  }
  if (G.location === 'clearing') {
    out('The grating is ' + (G.flags.grating_open ? 'open.' : 'closed and locked.'), 'narration');
  }

  // Items lying in the room
  for (const id of room.items || []) {
    if (ITEMS[id]) out(ITEMS[id].desc, 'item');
  }
  // Troll
  if (G.location === 'troll_room' && G.flags.troll_alive) {
    out('A nasty-looking troll, brandishing a bloody axe, blocks all passages out of the room.', 'narration');
  }
  // Exits, including ones opened by doors and gratings
  const exits = Object.entries(room.exits || {}).filter(([, v]) => v).map(([k]) => k);
  if (G.location === 'living_room' && G.flags.trapdoor_open) exits.push('down');
  if (G.location === 'clearing' && G.flags.grating_open) exits.push('down');
  if (G.location === 'behind_house') exits.push('west (window)');
  if (exits.length) out('Exits: ' + exits.join(', '), 'narration');
}

// ── Movement ──────────────────────────────────────────────────
const DIR_ALIASES = {
  n: 'north', s: 'south', e: 'east', w: 'west',
  u: 'up', d: 'down', ne: 'northeast', nw: 'northwest',
  se: 'southeast', sw: 'southwest',
};

function move(dir) {
  dir = DIR_ALIASES[dir] || dir;
  const room = ROOMS[G.location];

  // Special: trapdoor in living room
  if (G.location === 'living_room' && dir === 'down') {
    if (!G.flags.rug_moved) {
      out('You can\'t go that way.', 'error'); return;
    }
    if (!G.flags.trapdoor_open) {
      out('The trap door is closed.', 'narration'); return;
    }
    if (!isLit()) {
      out('You stumble into darkness and fall to your doom.', 'death');
      die('fell into the cellar in the dark'); return;
    }
    G.location = 'cellar';
    arrive(); return;
  }

  // Special: clearing grating
  if (G.location === 'clearing' && dir === 'down') {
    if (!G.flags.grating_open) {
      out('The grating is closed and locked.', 'narration'); return;
    }
    G.location = 'cellar';
    arrive(); return;
  }

  // Troll blocks passage
  if (G.location === 'troll_room' && G.flags.troll_alive) {
    out('The troll blocks your way, snarling!', 'narration'); return;
  }

  // Window shortcut
  if (G.location === 'behind_house' && (dir === 'window' || dir === 'west' || dir === 'in')) {
    G.location = 'kitchen';
    out('You climb through the window.', 'narration');
    arrive(); return;
  }

  const dest = room.exits && room.exits[dir];
  if (!dest) {
    out('You can\'t go that way.', 'error'); return;
  }
  G.location = dest;
  arrive();
}

// Full description on a first visit (or in VERBOSE mode), just the name after that
function arrive() {
  look(VERBOSE || !G.visited.has(G.location));
}

// ── Die ───────────────────────────────────────────────────────
function die(cause) {
  G.dead = true;
  out(`\n*** YOU HAVE DIED ***\n\nYou were ${cause}.`, 'death');
  out(`Your score was ${G.score}. Type RESTART to play again.`, 'score');
}

// ── Combat ────────────────────────────────────────────────────
function attack(target) {
  const words = objWords(target);
  if (mentions(words, 'troll')) {
    if (G.location !== 'troll_room') { out('There is no troll here.', 'error'); return; }
    if (!G.flags.troll_alive) { out('The troll is already dead.', 'narration'); return; }
    if (!hasItem('sword') && !hasItem('knife') && !hasItem('axe')) {
      out('You must be joking. The troll nicks you with his axe!', 'narration');
      die('sliced by the troll'); return;
    }
    if (Math.random() < 0.5) {
      G.flags.troll_alive = false;
      ROOMS.troll_room.items.push('axe');
      ITEMS.axe.location = 'troll_room';
      out('The troll swings his axe, but you dodge! You land a killing blow. The troll slumps to the floor.', 'narration');
      addScore(POINTS.troll);
    } else {
      out('You swing at the troll but miss! The troll sneers.', 'narration');
    }
    return;
  }
  out('Violence isn\'t the answer to this problem.', 'narration');
}

// ── Commands ──────────────────────────────────────────────────
function cmdLook(args) { look(true); }

function cmdInventory() {
  if (G.inventory.length === 0) { out('You are empty-handed.', 'narration'); return; }
  out('You are carrying:', 'narration');
  for (const id of G.inventory) {
    let extra = '';
    if (id === 'lamp') extra = G.flags.lamp_on ? ' (providing light)' : ' (off)';
    if (id === 'torch') extra = G.flags.torch_lit ? ' (burning)' : ' (unlit)';
    out('  ' + ITEMS[id].name + extra, 'item');
  }
}

function cmdTake(args) {
  const words = objWords(args);
  const room = ROOMS[G.location];
  // Take all
  if (words.includes('all')) {
    let took = false;
    if (G.location === 'west_of_house' && G.flags.mailbox_open && ITEMS.leaflet.location === 'mailbox') {
      ITEMS.leaflet.location = 'inventory';
      G.inventory.push('leaflet');
      out('Taken: ' + ITEMS.leaflet.name, 'item');
      took = true;
    }
    for (const id of [...(room.items || [])]) {
      if (!ITEMS[id] || !ITEMS[id].takeable) continue;
      room.items = room.items.filter(i => i !== id);
      G.inventory.push(id);
      ITEMS[id].location = 'inventory';
      out('Taken: ' + ITEMS[id].name, 'item');
      took = true;
    }
    if (!took) out('There is nothing here you can take.', 'narration');
    return;
  }

  // Leaflet from mailbox
  if (itemMatches('leaflet', words) && ITEMS.leaflet.location === 'mailbox' && G.location === 'west_of_house') {
    if (!G.flags.mailbox_open) { out('The mailbox is closed.', 'narration'); return; }
    ITEMS.leaflet.location = 'inventory';
    G.inventory.push('leaflet');
    out('Taken.', 'item');
    return;
  }

  const id = findItem(words);
  if (!id) { out('I don\'t see that here.', 'error'); return; }
  if (hasItem(id)) { out('You\'re already holding that.', 'narration'); return; }
  if (!ITEMS[id].takeable) { out('You can\'t take the ' + ITEMS[id].name + '.', 'error'); return; }
  room.items = room.items.filter(i => i !== id);
  G.inventory.push(id);
  ITEMS[id].location = 'inventory';
  out('Taken.', 'item');
}

function cmdDrop(args) {
  const words = objWords(args);
  const id = bestMatch(G.inventory, words);
  if (!id) { out('You aren\'t carrying that.', 'error'); return; }
  G.inventory = G.inventory.filter(i => i !== id);
  ITEMS[id].location = G.location;
  ROOMS[G.location].items = ROOMS[G.location].items || [];
  ROOMS[G.location].items.push(id);
  out('Dropped.', 'narration');
}

function cmdExamine(args) {
  const words = objWords(args);
  if (words.length === 0) { out('Examine what?', 'error'); return; }
  const here = loc => G.location === loc;
  if (mentions(words, 'mailbox', 'box') && here('west_of_house')) {
    out('The mailbox is a small metal box' + (G.flags.mailbox_open ? ' (open).' : ' (closed).'), 'narration');
    if (G.flags.mailbox_open && ITEMS.leaflet.location === 'mailbox') out('Inside is: a leaflet.', 'item');
    return;
  }
  if (mentions(words, 'trapdoor', 'trap', 'hatch') && here('living_room') && G.flags.rug_moved) {
    out('A wooden trap door in the floor. It is ' + (G.flags.trapdoor_open ? 'open.' : 'closed.'), 'narration');
    return;
  }
  if (mentions(words, 'trophy', 'case') && here('living_room')) {
    out('The trophy case is made of glass and wood.', 'narration');
    if (G.flags.trophy_case_contains.length === 0) {
      out('It is empty.', 'narration');
    } else {
      out('It contains:', 'narration');
      for (const id of G.flags.trophy_case_contains) out('  ' + ITEMS[id].name, 'item');
    }
    return;
  }
  if (mentions(words, 'rug', 'carpet') && here('living_room')) {
    out(G.flags.rug_moved
      ? 'The rug has been pushed to one side of the room.'
      : 'The rug is quite beautiful. One side of it seems to bulge slightly, as if something were underneath.', 'narration');
    return;
  }
  if (mentions(words, 'grating', 'grate') && here('clearing')) {
    out('A metal grating set into the ground. It is ' + (G.flags.grating_open ? 'open.' : 'closed and locked.'), 'narration');
    return;
  }
  if (mentions(words, 'troll') && here('troll_room') && G.flags.troll_alive) {
    out('A nasty-looking troll, brandishing a bloody axe. He does not look friendly.', 'narration');
    return;
  }
  const id = findItem(words);
  if (!id) { out('I don\'t see that here.', 'error'); return; }
  out(ITEMS[id].longDesc, 'narration');
}

function cmdRead(args) {
  const words = objWords(args);
  const id = findItem(words);
  if (id === 'leaflet') {
    if (!G.flags.leaflet_read) { G.flags.leaflet_read = true; addScore(POINTS.leaflet); }
    out(ITEMS.leaflet.longDesc, 'narration');
    return;
  }
  if (!id) { out('I don\'t see that here.', 'error'); return; }
  out('There is nothing to read on the ' + ITEMS[id].name + '.', 'narration');
}

function cmdMove(args) {
  const words = objWords(args);
  if (mentions(words, 'rug', 'carpet') && G.location === 'living_room') {
    if (G.flags.rug_moved) { out('Having moved the rug once, you find it impossible to move it again.', 'narration'); return; }
    G.flags.rug_moved = true;
    out('With a great effort, the rug is moved to one side of the room, revealing the dusty cover of a closed trap door.', 'narration');
    return;
  }
  out('Moving that doesn\'t accomplish anything.', 'narration');
}

function cmdOpen(args) {
  const words = objWords(args);
  if (mentions(words, 'mailbox', 'box')) {
    if (G.location !== 'west_of_house') { out('There is no mailbox here.', 'error'); return; }
    if (G.flags.mailbox_open) { out('It is already open.', 'narration'); return; }
    G.flags.mailbox_open = true;
    out(ITEMS.leaflet.location === 'mailbox' ? 'Opening the small mailbox reveals a leaflet.' : 'Opened.', 'narration');
    return;
  }
  if (mentions(words, 'trapdoor', 'trap', 'hatch')) {
    if (G.location !== 'living_room' || !G.flags.rug_moved) { out('There is no trap door here.', 'error'); return; }
    if (G.flags.trapdoor_open) { out('It is already open.', 'narration'); return; }
    G.flags.trapdoor_open = true;
    out('The door reluctantly opens to reveal a rickety staircase descending into darkness.', 'narration');
    return;
  }
  if (mentions(words, 'grating', 'grate')) {
    if (G.location !== 'clearing') { out('There is no grating here.', 'error'); return; }
    if (G.flags.grating_open) { out('It is already open.', 'narration'); return; }
    if (!hasItem('grating_key')) { out('The grating is locked. You need a key.', 'narration'); return; }
    G.flags.grating_open = true;
    out('You unlock and open the grating. A passageway leads down.', 'narration');
    return;
  }
  if (mentions(words, 'egg')) {
    if (!findItem(['egg'])) { out('There is no egg here.', 'error'); return; }
    if (G.flags.egg_open) { out('The egg is already open.', 'narration'); return; }
    G.flags.egg_open = true;
    ITEMS.canary.location = G.location;
    ROOMS[G.location].items = ROOMS[G.location].items || [];
    ROOMS[G.location].items.push('canary');
    out('As you open the jeweled egg, a golden clockwork canary drops out!', 'narration');
    return;
  }
  if (mentions(words, 'door') && G.location === 'living_room') {
    out('The door is nailed shut.', 'narration'); return;
  }
  if (mentions(words, 'window') && G.location === 'behind_house') {
    out('The window is already open far enough to climb through.', 'narration'); return;
  }
  out('I don\'t know how to open that.', 'narration');
}

function cmdClose(args) {
  const words = objWords(args);
  if (mentions(words, 'mailbox', 'box') && G.location === 'west_of_house') {
    G.flags.mailbox_open = false;
    out('Closed.', 'narration'); return;
  }
  if (mentions(words, 'trapdoor', 'trap', 'hatch') && G.location === 'living_room' && G.flags.rug_moved) {
    G.flags.trapdoor_open = false;
    out('The door swings shut and closes.', 'narration'); return;
  }
  if (mentions(words, 'grating', 'grate') && G.location === 'clearing') {
    G.flags.grating_open = false;
    out('Closed.', 'narration'); return;
  }
  out('I don\'t know how to close that.', 'narration');
}

// Turn a light source on (on = true) or off. With nothing named, picks whatever makes sense.
function setLight(args, on) {
  const words = objWords(args);
  let targets = [];
  if (itemMatches('lamp', words)) targets.push('lamp');
  if (mentions(words, 'torch')) targets.push('torch');
  if (targets.length === 0) {
    if (words.length) { out('You can\'t ' + (on ? 'light' : 'put out') + ' that.', 'error'); return; }
    targets = ['lamp', 'torch'].filter(hasItem);
    if (on) targets = targets.slice(0, 1);
    if (targets.length === 0) { out('You have nothing to ' + (on ? 'light.' : 'put out.'), 'narration'); return; }
  }
  const wasLit = isLit();
  for (const t of targets) {
    const flag = t === 'lamp' ? 'lamp_on' : 'torch_lit';
    if (!hasItem(t)) { out(`You don't have the ${t}.`, 'error'); continue; }
    if (G.flags[flag] === on) {
      const state = t === 'lamp' ? (on ? 'on' : 'off') : (on ? 'burning' : 'out');
      out(`The ${t} is already ${state}.`, 'narration');
      continue;
    }
    G.flags[flag] = on;
    if (t === 'lamp') out(on ? 'The lamp is now on.' : 'The lamp is now off.', 'narration');
    else out(on ? 'The torch blazes to life.' : 'The torch goes out.', 'narration');
  }
  // Light changing can reveal or hide a dark room
  if (!wasLit && isLit()) look(true);
  else if (wasLit && !isLit()) out('It is now pitch black.', 'narration');
}

function cmdPutIn(args) {
  // "put X in/into Y"
  const match = args.toLowerCase().match(/(.+?)\s+(?:in|into|on)\s+(.+)/);
  if (!match) { out('Put what where?', 'error'); return; }
  const whatWords = objWords(match[1]);
  const contWords = objWords(match[2]);

  if (mentions(contWords, 'trophy', 'case')) {
    if (G.location !== 'living_room') { out('There is no trophy case here.', 'error'); return; }
    const id = bestMatch(G.inventory, whatWords);
    if (!id) { out('You aren\'t carrying that.', 'error'); return; }
    if (!ITEMS[id].treasure) { out('That doesn\'t belong in the trophy case.', 'narration'); return; }
    G.inventory = G.inventory.filter(i => i !== id);
    ITEMS[id].location = 'trophy_case';
    out('Done. The ' + ITEMS[id].name + ' gleams in the trophy case.', 'item');
    putInTrophyCase(id);
    checkWin();
    return;
  }
  out('I can\'t put that there.', 'narration');
}

function cmdScore() {
  out(`Your score is ${G.score} out of a possible ${MAX_SCORE}, in ${G.moves} moves.`, 'score');
}

function cmdHelp() {
  out('Commands:', 'narration');
  out('  LOOK (L) — describe surroundings', 'narration');
  out('  GO <dir> — move (NORTH/SOUTH/EAST/WEST/UP/DOWN, or N/S/E/W/U/D)', 'narration');
  out('  TAKE/GET <item> — pick up an item (or TAKE ALL)', 'narration');
  out('  DROP <item> — drop an item', 'narration');
  out('  INVENTORY (I) — list carried items', 'narration');
  out('  EXAMINE (X) / LOOK AT <item> — examine an item', 'narration');
  out('  READ <item> — read an item', 'narration');
  out('  OPEN/CLOSE <thing> — open or close things', 'narration');
  out('  MOVE <thing> — move something out of the way', 'narration');
  out('  LIGHT / TURN ON <lamp/torch> — light a light source', 'narration');
  out('  EXTINGUISH / TURN OFF <lamp/torch> — put one out', 'narration');
  out('  PUT <item> IN <container> — place item in container', 'narration');
  out('  ATTACK/KILL <enemy> — fight an enemy', 'narration');
  out('  SCORE — show your score', 'narration');
  out('  RESTART — start over', 'narration');
  out('  VERBOSE / BRIEF — full room descriptions always, or only on first visit', 'narration');
}

// Brief mode (the default) describes a room in full only on your first visit
let VERBOSE = false;

function cmdVerbose(on) {
  VERBOSE = on;
  out(VERBOSE ? 'Maximum verbosity.' : 'Brief descriptions.', 'narration');
}

// ── Win Condition ─────────────────────────────────────────────
function checkWin() {
  const allIn = TREASURES.every(t => G.flags.trophy_case_contains.includes(t));
  if (allIn) {
    G.won = true;
    out('\n*** YOU HAVE WON ***\n\nYou have collected all the treasures and placed them in the trophy case!', 'win');
    addScore(POINTS.win);
    out(`Final score: ${G.score} of ${MAX_SCORE}. Rank: ${getRank()}.`, 'score');
  }
}

function getRank() {
  const pct = G.score / MAX_SCORE;
  if (pct >= 1) return 'Master Adventurer';
  if (pct >= 0.6) return 'Adventurer';
  if (pct >= 0.3) return 'Brave Novice';
  if (pct >= 0.15) return 'Novice';
  return 'Beginner';
}

// ── Restart ───────────────────────────────────────────────────
function restart() {
  location.reload();
}

// ── Parser ────────────────────────────────────────────────────
function parse(raw) {
  if (!raw.trim()) return;
  out('> ' + raw, 'player-cmd');

  // Punctuation never matters: "take lamp." and "n!" work like "take lamp" and "n"
  let input = raw.trim().toLowerCase();
  if (input !== '?') input = input.replace(/[.,!?;:"]+/g, ' ').trim();

  if (G.dead || G.won) {
    if (input === 'restart') { restart(); return; }
    out('Type RESTART to play again.', 'narration'); return;
  }
  if (!input) { out('I beg your pardon?', 'error'); return; }
  G.moves++;
  runCommand(input);
  updateStatus();
}

function runCommand(input) {
  const words = input.split(/\s+/);
  const verb = words[0];
  const rest = words.slice(1).join(' ');

  // Direction shortcut
  if (DIR_ALIASES[verb] || ['north','south','east','west','up','down','northeast','northwest','southeast','southwest'].includes(verb)) {
    move(verb); return;
  }
  // Go <dir>
  if (verb === 'go' && rest) { move(rest.replace(/^(?:to\s+)?(?:the\s+)?/, '')); return; }   // "go to the north"
  // Enter/climb window
  if ((verb === 'enter' || verb === 'climb') && rest.includes('window')) { move('window'); return; }
  if ((verb === 'enter' || verb === 'climb') && rest.includes('tree')) { move('up'); return; }

  switch(verb) {
    case 'look': case 'l':
      if (/^(at|in|inside)\b/.test(rest)) cmdExamine(rest);
      else cmdLook(rest);
      break;
    case 'inventory': case 'i': cmdInventory(); break;
    case 'take': case 'get': case 'pick':
      cmdTake(rest || 'all'); break;
    case 'drop': case 'put':
      if (rest.match(/\s+(?:in|into|on)\s+/)) { cmdPutIn(rest); break; }
      cmdDrop(rest); break;
    case 'examine': case 'x': case 'inspect':
      cmdExamine(rest); break;
    case 'read': cmdRead(rest); break;
    case 'open': cmdOpen(rest); break;
    case 'close': case 'shut': cmdClose(rest); break;
    case 'move': case 'push': case 'pull': case 'lift': case 'shift':
      cmdMove(rest); break;
    case 'light':
      setLight(rest, true); break;
    case 'turn': case 'switch': {
      // "turn on lamp", "turn the lamp off"
      const on = !/\boff\b/.test(rest);
      setLight(rest.replace(/\b(on|off)\b/g, ' '), on);
      break;
    }
    case 'extinguish': case 'douse': case 'unlight':
      setLight(rest, false); break;
    case 'blow':
      setLight(rest.replace(/\bout\b/g, ' '), false); break;
    case 'attack': case 'kill': case 'fight': case 'hit': case 'stab':
      attack(rest); break;
    case 'score': cmdScore(); break;
    case 'help': case '?': cmdHelp(); break;
    case 'verbose': cmdVerbose(true); break;
    case 'brief': cmdVerbose(false); break;
    case 'restart': restart(); break;
    case 'quit': case 'q':
      out('Come back soon, adventurer.', 'narration');
      G.dead = true; break;
    case 'wait': case 'z':
      out('Time passes.', 'narration'); break;
    case 'xyzzy': case 'plugh':
      out('A hollow voice says "Fool."', 'narration'); break;
    default:
      out('I don\'t understand that command. Type HELP for assistance.', 'error');
  }
}

// ── Init ──────────────────────────────────────────────────────
function init() {
  out('ZORK I: The Great Underground Empire', 'location');
  out('Copyright (c) 1981, 1982, 1983 Infocom, Inc.', 'narration');
  out('All rights reserved.', 'narration');
  out('Zork is a registered trademark of Infocom, Inc.', 'narration');
  out('(Fan tribute — this is a JavaScript recreation for educational purposes.)', 'narration');
  sep();
  G.location = 'west_of_house';
  look(true);
  sep();
  updateStatus();
}

// ── Input Handling ─────────────────────────────────────────────
const input = $('cmd-input');
const historyStack = [];
let historyIdx = -1;

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const val = input.value;
    if (val.trim()) {
      historyStack.unshift(val);
      historyIdx = -1;
    }
    input.value = '';
    parse(val);
  } else if (e.key === 'ArrowUp') {
    if (historyIdx < historyStack.length - 1) {
      historyIdx++;
      input.value = historyStack[historyIdx];
    }
    e.preventDefault();
  } else if (e.key === 'ArrowDown') {
    if (historyIdx > 0) {
      historyIdx--;
      input.value = historyStack[historyIdx];
    } else {
      historyIdx = -1;
      input.value = '';
    }
    e.preventDefault();
  }
});

init();
</script>
